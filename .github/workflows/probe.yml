name: probe
on:
  push:
    branches: [main]
    paths: ['probe/probe.py', '.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q huggingface_hub
      - run: python probe/probe.py
      - name: Save results to the repo
        run: |
          git config user.name "coffer-voice-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/out
          git commit -m "Probe results" || echo "nothing to commit"
          git push
